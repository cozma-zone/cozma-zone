<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073665">
  <meta name="description" content="Cosma Collagen الكويت — روتين يومي بسيط للعناية بالجمال من الداخل.">
  <title>Cosma Collagen الكويت | جمالك يبدأ من الداخل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="page-images" aria-label="صفحة Cosma Collagen">
      <img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/03-benefits.webp" alt="فوائد ومكونات Cosma Collagen" fetchpriority="high" decoding="async">
      <div class="result-columns" aria-label="نتيجة الشعر ونتيجة البشرة">
        <img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/05-hair.webp" alt="تجربة مرتبطة بمظهر الشعر مع Cosma Collagen" loading="lazy" decoding="async">
        <img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/06-skin.webp" alt="تجربة مرتبطة بمظهر البشرة مع Cosma Collagen" loading="lazy" decoding="async">
      </div>
      <a href="#order" aria-label="شاهدي عروض Cosma Collagen"><img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/01-hero.webp" alt="Cosma Collagen — جمالك يبدأ من روتينك اليومي" loading="lazy" decoding="async"></a>
      <img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/08-acne.webp" alt="نتيجة مصورة للعناية بمظهر البشرة" loading="lazy" decoding="async">
      <img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/02-overview.webp" alt="روتين الجمال اليومي مع Cosma Collagen" loading="lazy" decoding="async">
      <img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/07-tone.webp" alt="تجربة مرتبطة بنضارة وصفاء البشرة" loading="lazy" decoding="async">
      <a href="#order" aria-label="انتقلي إلى عروض Cosma Collagen"><img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/04-use.webp" alt="طريقة استخدام Cosma Collagen وروتين يومي سهل" loading="lazy" decoding="async"></a>
      <img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/10-results-grid.webp" alt="شبكة نتائج وتجارب Cosma Collagen" loading="lazy" decoding="async">
    </section>

    <section class="order-section" id="order">
      <div class="order-wrap">
        <div class="intro">
          <span class="eyebrow">COSMA COLLAGEN · KUWAIT</span>
          <h1>اختاري روتينك المناسب 💙</h1>
          <p>كلما زادت الكمية زاد التوفير — الدفع عند الاستلام</p>
        </div>
        <div class="trust-row" aria-label="مزايا الطلب">
          <span>✓ الدفع عند الاستلام</span><span>✓ طلب سريع</span><span>✓ عروض توفير واضحة</span>
        </div>
        <form id="order-form" class="order-card">
          <fieldset class="offers">
            <legend class="visually-hidden">اختاري الباقة</legend>
            <label class="offer">
              <input type="radio" name="offer" value="1" checked>
              <span class="details"><b>باقة البداية</b><small>1 عبوة</small></span>
              <span class="price"><strong>19 د.ك</strong><small>لبداية روتينك</small></span>
            </label>
            <label class="offer">
              <input type="radio" name="offer" value="2">
              <span class="details"><b>باقة التوفير</b><small>2 عبوة</small></span>
              <span class="price"><strong>25 د.ك</strong><small>توفير أكبر</small></span>
            </label>
            <label class="offer featured">
              <input type="radio" name="offer" value="3">
              <span class="badge">أفضل قيمة</span>
              <span class="details"><b>الباقة الذهبية</b><small>3 عبوات</small></span>
              <span class="price"><strong>29 د.ك</strong><small>أفضل سعر للعبوة 🔥</small></span>
            </label>
          </fieldset>
          <div class="fields">
            <label><span class="visually-hidden">الاسم الكامل</span><input name="name" autocomplete="name" placeholder="الاسم الكامل" required minlength="2"></label>
            <label><span class="visually-hidden">رقم الهاتف</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="رقم الهاتف الكويتي" required></label>
            <label><span class="visually-hidden">العنوان</span><input name="address" autocomplete="street-address" placeholder="المنطقة والقطعة والشارع والمنزل" required></label>
          </div>
          <p class="check-note">يرجى التأكد من صحة بيانات التواصل والعنوان</p>
          <button class="submit" type="submit">إرسال الطلب — الدفع عند الاستلام</button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p class="bottom-note">ابدئي روتينك مع Cosma Collagen اليوم</p>
      </div>
    </section>
    <section class="page-images post-order-images" aria-label="نتائج وآراء إضافية">
      <img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/09-results.webp" alt="نتائج وتجارب متعددة مع Cosma Collagen" loading="lazy" decoding="async">
      <img width="600" height="1066" src="https://multicollagenksa.github.io/cosma-collagen/assets/11-testimonials.webp" alt="آراء وتجارب عميلات Cosma Collagen" loading="lazy" decoding="async">
    </section>
  </main>
  <a class="sticky-order" href="#order" aria-label="اطلبي Cosma الآن وانتقلي إلى نموذج الطلب"><span class="sticky-text">اطلبي Cosma الآن واستفيدي من عرض التوفير</span><span class="sticky-arrow" aria-hidden="true">↓</span></a>
  <script src="app.js" defer></script>
</body>
</html>
